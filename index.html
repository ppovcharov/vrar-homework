<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
            "vax": "https://boytchev.github.io/CourseVAX/lib/vax.js"
        }
    }
    </script>

    <style>
        body { margin: 0; overflow: hidden; }
        #enableMotion {
            position: absolute;
            top: 20px; left: 20px; z-index: 10;
            font-size: 18px; padding: 10px 16px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #ccc; border-radius: 8px; cursor: pointer;
        }
    </style>
</head>

<body>

<button id="enableMotion">Enable motion</button>

<script type="module">
    import * as THREE from "three";
    import * as VAX from "vax";
    import { StereoEffect } from "three/addons/effects/StereoEffect.js";

    let effect = null;
    let isStereoRendering = false;
    const currentSize = new THREE.Vector2();

    VAX.init(animate);

    VAX.scene.background = new THREE.Color(0x101010);
    const ambient = new THREE.AmbientLight(0xffffff, 0.8);
    VAX.scene.add(ambient);
    const pointLight = new THREE.PointLight(0xffffff, 1.5);
    VAX.scene.add(pointLight);

    VAX.camera.position.set(0, 0, 0);

    let deviceAlpha = 0, deviceGamma = 0;
    let startAlpha = null, startGamma = null;

    function handleOrientation(event) {
        if (event.alpha === null) return;
        if (startAlpha === null) {
            startAlpha = event.alpha;
            startGamma = event.gamma;
        }
        deviceAlpha = event.alpha - startAlpha;
        deviceGamma = event.gamma - startGamma;
    }

    document.getElementById("enableMotion").addEventListener("click", async () => {
        if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
            try {
                const response = await DeviceOrientationEvent.requestPermission();
                if (response === "granted") {
                    window.addEventListener("deviceorientation", handleOrientation, true);
                    document.getElementById("enableMotion").style.display = "none";
                }
            } catch (e) {}
        } else {
            window.addEventListener("deviceorientation", handleOrientation, true);
            document.getElementById("enableMotion").style.display = "none";
        }
    });

    const size = 60;
    const roomGeo = new THREE.BoxGeometry(size, size, size);
    const roomMat = new THREE.MeshLambertMaterial({
        color: 0x00ff00,
        side: THREE.BackSide
    });
    const room = new THREE.Mesh(roomGeo, roomMat);
    VAX.scene.add(room);

    const coneGeo = new THREE.ConeGeometry(0.8, 3, 16);
    const wallPos = size / 2 - 0.5;

    function addWallCones(axis, sign) {
        for (let i = 0; i < 40; i++) {
            const mat = new THREE.MeshPhongMaterial({
                color: new THREE.Color().setHSL(Math.random(), 0.8, 0.5)
            });
            const cone = new THREE.Mesh(coneGeo, mat);

            const a = (Math.random() - 0.5) * (size - 10);
            const b = (Math.random() - 0.5) * (size - 10);

            if (axis === 'x') cone.position.set(sign * wallPos, a, b);
            if (axis === 'y') cone.position.set(a, sign * wallPos, b);
            if (axis === 'z') cone.position.set(a, b, sign * wallPos);

            VAX.scene.add(cone);
        }
    }

    addWallCones('x', 1); addWallCones('x', -1);
    addWallCones('y', 1); addWallCones('y', -1);
    addWallCones('z', 1); addWallCones('z', -1);

    const originalRender = VAX.renderer.render.bind(VAX.renderer);
    VAX.renderer.render = function(scene, camera) {
        if (isStereoRendering) originalRender(scene, camera);
    };

    function animate(t, dT) {
        if (!effect && VAX.renderer) {
            effect = new StereoEffect(VAX.renderer);
            effect.setSize(window.innerWidth, window.innerHeight);
            effect.eyeSeparation = 1;
        }

        VAX.camera.rotation.order = 'YXZ';
        const rotY = THREE.MathUtils.degToRad(deviceAlpha);
        const rotX = THREE.MathUtils.degToRad(-deviceGamma); 

        VAX.camera.rotation.y = rotY;
        VAX.camera.rotation.x = rotX;

        if (effect) {
            VAX.renderer.getSize(currentSize);
            effect.setSize(currentSize.x, currentSize.y);
            
            isStereoRendering = true;
            effect.render(VAX.scene, VAX.camera);
            isStereoRendering = false;
        }
    }
</script>

</body>
</html>
