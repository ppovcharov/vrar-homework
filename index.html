<!DOCTYPE html>
<html>
<head>
    <title>E1113: Кристален свят (Manual Orientation)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
            "vax": "https://boytchev.github.io/CourseVAX/lib/vax.js"
        }
    }
    </script>

    <style>
        body { margin: 0; overflow: hidden; }

        /* Стиловете 1:1 от твоя файл */
        #enableMotion {
            position: absolute;
            top: 20px; left: 20px; z-index: 10;
            font-size: 18px; padding: 10px 16px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #ccc; border-radius: 8px; cursor: pointer;
        }
    </style>
</head>

<body>

<button id="enableMotion">Enable motion</button>

<script type="module">
    import * as THREE from "three";
    import * as VAX from "vax";
    // Тук НЕ ни трябват OrbitControls или DeviceOrientationControls, 
    // защото ще ползваме твоята ръчна логика.

    VAX.init(animate);

    // --- НАСТРОЙКИ НА КАМЕРАТА ---
    VAX.camera.fov = 60;
    VAX.camera.near = 0.1;
    VAX.camera.far = 1000;
    VAX.camera.position.set(0, 0, 0.1);
    
    // Важно от твоя файл: Сменяме реда на въртене, за да работи коректно
    VAX.camera.rotation.order = 'YXZ'; 
    VAX.camera.updateProjectionMatrix();


    // --- ЛОГИКА ЗА ОРИЕНТАЦИЯ (Взета 1:1 от vax-0MI0800358-3.html) ---
    
    let deviceAlpha = 0, deviceGamma = 0;
    let startAlpha = null, startGamma = null;

    function handleOrientation(event) {
        if (event.alpha === null) return;
        if (startAlpha === null) {
            startAlpha = event.alpha;
            startGamma = event.gamma;
        }
        // Изчисляваме разликата спрямо началната позиция
        deviceAlpha = event.alpha - startAlpha;
        deviceGamma = event.gamma - startGamma;
    }

    document.getElementById("enableMotion").addEventListener("click", async () => {
        // Проверка за iOS 13+
        if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
            try {
                const response = await DeviceOrientationEvent.requestPermission();
                if (response === "granted") {
                    window.addEventListener("deviceorientation", handleOrientation, true);
                    document.getElementById("enableMotion").style.display = "none";
                }
            } catch (e) {
                console.error(e);
            }
        } else {
            // За Android и Chrome Simulator
            window.addEventListener("deviceorientation", handleOrientation, true);
            document.getElementById("enableMotion").style.display = "none";
        }
    });


    // --- СЦЕНА (Кристали и Текстура) ---

    // 1. Текстура
    var texture = new THREE.CubeTextureLoader().load([
        'BerzeliiPark/posx.jpg', 'BerzeliiPark/negx.jpg',
        'BerzeliiPark/posy.jpg', 'BerzeliiPark/negy.jpg',
        'BerzeliiPark/posz.jpg', 'BerzeliiPark/negz.jpg'
    ]);
    
    texture.mapping = THREE.CubeRefractionMapping;
    VAX.scene.background = texture;
    VAX.scene.background.colorSpace = THREE.LinearSRGBColorSpace;

    // 2. Кристали
    var crystals = [];
    var geometry = new THREE.IcosahedronGeometry(10, 0); 
    
    var material = new THREE.MeshBasicMaterial({ 
        envMap: texture,       
        refractionRatio: 0.90,
        side: THREE.DoubleSide
    });

    for(var i=0; i<40; i++) {
        var mesh = new THREE.Mesh(geometry, material);
        
        var phi = Math.random() * Math.PI * 2;
        var theta = Math.random() * Math.PI;
        var r = 80 + Math.random() * 60; 

        mesh.position.x = r * Math.sin(theta) * Math.cos(phi);
        mesh.position.y = r * Math.cos(theta);
        mesh.position.z = r * Math.sin(theta) * Math.sin(phi);

        mesh.rotation.x = Math.random() * Math.PI;
        mesh.rotation.y = Math.random() * Math.PI;

        mesh.userData = {
            rotSpeedX: (Math.random() - 0.5) * 0.02,
            rotSpeedY: (Math.random() - 0.5) * 0.02
        };

        VAX.scene.add(mesh);
        crystals.push(mesh);
    }


    // --- ANIMATE ---
    function animate() {
        
        // 1. Прилагаме въртенето от симулатора/телефона (Логика от твоя файл)
        const rotY = THREE.MathUtils.degToRad(deviceAlpha);
        // Знакът минус тук е важен за правилното движение нагоре/надолу
        const rotX = THREE.MathUtils.degToRad(-deviceGamma); 

        VAX.camera.rotation.y = rotY;
        VAX.camera.rotation.x = rotX;


        // 2. Въртим самите кристали
        for(var i=0; i<crystals.length; i++) {
            crystals[i].rotation.x += crystals[i].userData.rotSpeedX;
            crystals[i].rotation.y += crystals[i].userData.rotSpeedY;
        }
    }
</script>

</body>
</html>
