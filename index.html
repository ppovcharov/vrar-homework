<!DOCTYPE html>
<html>
	<head>
		<title>E1113: Кристален свят (Mobile AR)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		
		<style>
			/* Стилизиране на бутона за старт */
			#startBtn {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				padding: 20px 40px;
				font-size: 24px;
				font-weight: bold;
				color: white;
				background: rgba(0, 0, 0, 0.7);
				border: 2px solid white;
				border-radius: 10px;
				cursor: pointer;
				z-index: 9999; /* Най-отгоре */
			}
			#startBtn:active {
				background: white;
				color: black;
			}
		</style>

		<script type="importmap">
		  {
			"imports": {
			  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
			  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
			  "vax": "https://boytchev.github.io/CourseVAX/lib/vax.js"
			}
		  }
		</script>
	</head>
	
	<body>
		<button id="startBtn">СТАРТ AR</button>

		<script type="module">
			import * as THREE from "three";
			// Импортираме контролите за телефон
			import { DeviceOrientationControls } from "three/addons/controls/DeviceOrientationControls.js";
			import { OrbitControls } from "three/addons/controls/OrbitControls.js";
			import * as VAX from "vax";

			VAX.init(animate);

			// Настройки на камерата
			VAX.camera.fov = 60; 
			VAX.camera.near = 0.1;
			VAX.camera.far = 1000; 
			VAX.camera.position.set(0, 0, 0.1);
			VAX.camera.updateProjectionMatrix();

			// Променлива за контролите (ще я сменяме динамично)
			var controls;

			// Първоначално пускаме OrbitControls (за тест на PC)
			controls = new OrbitControls(VAX.camera, VAX.renderer.domElement);
			controls.enableZoom = false;
			controls.enablePan = false;
			controls.enableDamping = true;
			controls.dampingFactor = 0.1;

			// --- ЛОГИКА ЗА БУТОНА И ТЕЛЕФОНА ---
			var btn = document.getElementById('startBtn');
			
			btn.addEventListener('click', function() {
				// Проверка дали е iOS 13+ (iPhone)
				if ( typeof( DeviceOrientationEvent ) !== 'undefined' && typeof( DeviceOrientationEvent.requestPermission ) === 'function' ) {
					
					// Изискване на разрешение от Apple
					DeviceOrientationEvent.requestPermission()
						.then( response => {
							if ( response == 'granted' ) {
								enablePhoneControls();
							} else {
								alert("Трябва да разрешите достъпа до сензорите!");
							}
						})
						.catch( console.error );
				} else {
					// За Android и други устройства, които не искат разрешение
					enablePhoneControls();
				}
			});

			function enablePhoneControls() {
				// Скриваме бутона
				btn.style.display = 'none';
				
				// Унищожаваме старите контроли (мишката)
				controls.dispose();
				
				// Пускаме жироскопа
				controls = new DeviceOrientationControls( VAX.camera );
			}

			// --- СЪЗДАВАНЕ НА СЦЕНАТА ---

			var texture = new THREE.CubeTextureLoader().load([
						'BerzeliiPark/posx.jpg', 'BerzeliiPark/negx.jpg',
						'BerzeliiPark/posy.jpg', 'BerzeliiPark/negy.jpg',
						'BerzeliiPark/posz.jpg', 'BerzeliiPark/negz.jpg']);
			
			texture.mapping = THREE.CubeRefractionMapping; 
			VAX.scene.background = texture;
			VAX.scene.background.colorSpace = THREE.LinearSRGBColorSpace;

			var crystals = []; 
			var geometry = new THREE.IcosahedronGeometry(10, 0);
			
			var material = new THREE.MeshBasicMaterial({ 
				envMap: texture,       
				refractionRatio: 0.90,
			});

			for(var i=0; i<40; i++) {
				var mesh = new THREE.Mesh(geometry, material);
				
				var phi = Math.random() * Math.PI * 2;
				var theta = Math.random() * Math.PI;
				var r = 80 + Math.random() * 60; 

				mesh.position.x = r * Math.sin(theta) * Math.cos(phi);
				mesh.position.y = r * Math.cos(theta);
				mesh.position.z = r * Math.sin(theta) * Math.sin(phi);

				mesh.rotation.x = Math.random() * Math.PI;
				mesh.rotation.y = Math.random() * Math.PI;

                mesh.userData = {
                    rotSpeedX: (Math.random() - 0.5) * 0.02,
                    rotSpeedY: (Math.random() - 0.5) * 0.02
                };

				VAX.scene.add(mesh);
				crystals.push(mesh);
			}

			function animate()
			{
				// Въртене на кристалите
				for(var i=0; i<crystals.length; i++) {
					crystals[i].rotation.x += crystals[i].userData.rotSpeedX;
					crystals[i].rotation.y += crystals[i].userData.rotSpeedY;
				}
				
				// Обновяване на контролите (независимо дали са мишка или телефон)
				controls.update();
			}
			
		</script>	
	</body>
</html>
